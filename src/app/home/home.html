<div class="md:max-w-2xl lg:max-w-4xl mx-auto w-full">
  <app-header title="Did I Miss My Train"></app-header>
  <div class="p-4">
    <div class="flex flex-col gap-2">
      <div *ngIf="favoritesService.favorites().length > 0" class="flex flex-col gap-2">
        <div class="flex justify-between items-center">
          <h2 class="text-xl font-bold text-white">Favorites</h2>
          <a routerLink="/favorites" class="text-sm font-medium text-blue-400 hover:underline">
            View All
          </a>
        </div>
        <div class="flex flex-col gap-2">
          <app-favorite-card
            *ngFor="let favorite of favoritesService.favorites()"
            [favorite]="favorite"
          ></app-favorite-card>
        </div>
      </div>

      <div
        *ngFor="let group of groupedLines"
        class="flex flex-row flex-wrap gap-2"
      >
        <app-route-badge
          *ngFor="let line of group.lines"
          [routeId]="line"
          size="large"
          [status]="lineStatuses().get(line) || 'active'"
        ></app-route-badge>
      </div>
    </div>
    <div class="max-w-xs pt-4">
      <app-station-search (stationSelected)="onStationSelected($event)"></app-station-search>
    </div>
  </div>
</div>
