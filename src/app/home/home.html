<div class="h-full">
  <app-header title="Select a line" />

  <div class="p-4 md:max-w-2xl lg:max-w-4xl mx-auto w-full">
    <div class="flex flex-col gap-4">
      <div
        class="flex flex-row gap-2 justify-start"
        *ngFor="let group of groupedLines"
      >
        <a [routerLink]="['/line', line]" *ngFor="let line of group">
          <app-route-badge [routeId]="line" size="large" />
        </a>
      </div>
    </div>
  </div>
</div>
