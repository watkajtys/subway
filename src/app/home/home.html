<div class="p-4 md:max-w-2xl lg:max-w-4xl mx-auto w-full">
  <h1 class="text-2xl font-bold text-zinc-900 dark:text-white mb-4">
    Select a Line
  </h1>
  <div class="flex flex-col gap-4">
    <div *ngFor="let group of groupedLines" class="rounded-lg p-4 bg-zinc-100 dark:bg-zinc-800">
      <h2 class="text-xl font-bold text-zinc-900 dark:text-white mb-2">
        {{ group.name }}
      </h2>
      <div class="flex flex-row gap-2">
        <a *ngFor="let line of group.lines" [routerLink]="['/line', line]">
          <app-route-badge [routeId]="line" size="large"></app-route-badge>
        </a>
      </div>
    </div>
  </div>
</div>
