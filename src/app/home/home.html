<div class="p-4 md:max-w-2xl lg:max-w-4xl mx-auto w-full">
  <div class="flex flex-col gap-4 text-center">
    <h1 class="text-4xl font-bold">Did I Miss My Train?</h1>
    <p class="text-lg">Select a line</p>
  </div>

  <div class="flex flex-col gap-4 mt-8">
    <div
      class="flex flex-row gap-2 justify-center"
      *ngFor="let group of groupedLines"
    >
      <a [routerLink]="['/line', line]" *ngFor="let line of group">
        <app-route-badge [routeId]="line" size="large" />
      </a>
    </div>
  </div>
</div>
