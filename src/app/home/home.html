<div class="flex items-center justify-center min-h-screen">
  <div class="p-4 md:max-w-2xl lg:max-w-4xl mx-auto w-full">
    <h1 class="text-2xl font-bold text-zinc-900 dark:text-white mb-4">
      Did I Miss My Train
    </h1>
    <div class="flex flex-col gap-4">
      <div
        *ngFor="let group of groupedLines"
        class="flex flex-row flex-wrap gap-2"
      >
        <a *ngFor="let line of group.lines" [routerLink]="['/line', line]">
          <app-route-badge [routeId]="line" size="large"></app-route-badge>
        </a>
      </div>
    </div>
    <div class="my-4"></div>
    <div class="max-w-xs">
      <app-station-search></app-station-search>
    </div>
  </div>
</div>
