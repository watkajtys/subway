<a [routerLink]="['/station', stationName()]"
  class="bg-zinc-800 rounded-lg p-4 flex flex-col gap-2 cursor-pointer hover:bg-zinc-700 transition-colors w-full"
>
  <h3 class="font-bold text-lg text-white w-full">{{ stationName() }}</h3>
  <div class="flex items-center justify-between w-full">
    <div class="flex items-center gap-2">
      <app-route-badge [routeId]="favorite.lineId" size="small"></app-route-badge>
      <span class="text-sm text-zinc-400">{{ favorite.direction }}</span>
    </div>
    <div class="text-right">
      <div *ngIf="nextArrivals().length > 0; else noDepartures">
        <p
          class="text-xl font-bold text-white"
          [ngStyle]="getTimeStyles(nextArrivals()[0].arrivalTime)"
        >
          {{ nextArrivals()[0].arrivalTime | arrivalTime }}
        </p>
        <p *ngIf="nextArrivals().length > 1" class="text-sm text-zinc-400">
          {{ nextArrivals()[1].arrivalTime | arrivalTime }}
        </p>
      </div>
      <ng-template #noDepartures>
        <p class="text-zinc-400">No upcoming departures.</p>
      </ng-template>
    </div>
  </div>
</a>
