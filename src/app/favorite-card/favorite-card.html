<a [routerLink]="['/station', stationName()]"
  class="bg-zinc-800 rounded-lg p-4 flex items-center gap-4 cursor-pointer hover:bg-zinc-700 transition-colors w-full"
>
  <app-route-badge [routeId]="favorite.lineId" size="large"></app-route-badge>
  <div class="flex-1">
    <h3 class="font-bold text-lg text-white">{{ stationName() }}</h3>
    <p class="text-sm text-zinc-400">
      {{ favorite.direction }}
    </p>
  </div>
  <div class="text-right">
    <div *ngIf="nextArrivals().length > 0; else noDepartures">
      <p class="text-3xl font-bold text-white">
        {{ nextArrivals()[0].arrivalTime | arrivalTime }}
      </p>
      <p *ngIf="nextArrivals().length > 1" class="text-lg text-zinc-400">
        {{ nextArrivals()[1].arrivalTime | arrivalTime }}
      </p>
    </div>
    <ng-template #noDepartures>
      <p class="text-zinc-400">No upcoming departures.</p>
    </ng-template>
  </div>
</a>
