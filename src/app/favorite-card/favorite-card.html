<a [routerLink]="['/station', stationName()]"
  class="bg-zinc-100 dark:bg-zinc-800 rounded-lg p-4 flex flex-col gap-4 cursor-pointer hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors"
>
  <div class="flex items-center gap-4">
    <app-route-badge [routeId]="favorite.lineId" size="large"></app-route-badge>
    <div>
      <h3 class="font-bold text-lg dark:text-white">{{ stationName() }}</h3>
      <p class="text-sm text-zinc-500 dark:text-zinc-400">
        {{ favorite.direction }}
      </p>
    </div>
  </div>
  <div class="flex justify-between items-end">
    <div *ngIf="nextArrivals().length > 0; else noDepartures">
      <p class="text-3xl font-bold dark:text-white">
        {{ nextArrivals()[0].arrivalTime | arrivalTime }}
      </p>
      <p *ngIf="nextArrivals().length > 1" class="text-lg text-zinc-500 dark:text-zinc-400">
        {{ nextArrivals()[1].arrivalTime | arrivalTime }}
      </p>
    </div>
    <ng-template #noDepartures>
      <p class="text-zinc-500 dark:text-zinc-400">No upcoming departures.</p>
    </ng-template>
  </div>
</a>
