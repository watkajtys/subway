<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark text-zinc-900 dark:text-white group/design-root overflow-x-hidden">
  <div class="md:max-w-2xl lg:max-w-4xl mx-auto w-full">
    <header class="sticky top-0 z-10 flex items-center bg-background-light/80 dark:bg-background-dark/80 p-4 pb-2 justify-between backdrop-blur-sm">
      <div class="flex-1 text-left">
        <h1 class="text-xl font-bold">Did I Miss My Train?</h1>
      </div>
    </header>

    <main class="flex flex-1 flex-col justify-center p-6">
      <div class="w-full max-w-md mx-auto mt-10 space-y-8">
        <app-station-search></app-station-search>

        <div class="space-y-6">
          <div *ngFor="let group of lineGroups" class="space-y-4">
            <div class="flex justify-start gap-4 flex-wrap">
              <a *ngFor="let line of group.lines" [routerLink]="['/line', line]" class="focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark rounded-full">
                <app-route-badge [routeId]="line" [size]="'large'"></app-route-badge>
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
