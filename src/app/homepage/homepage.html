<app-header title="did i miss my train"></app-header>
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark text-zinc-900 dark:text-white group/design-root overflow-x-hidden">
  <div class="md:max-w-2xl lg:max-w-4xl mx-auto w-full p-4">
    <div class="relative">
      <input
        type="text"
        placeholder="Search for a station..."
        (input)="handleSearch($event)"
        class="w-full p-4 bg-zinc-100 dark:bg-zinc-800 rounded-lg"
      />
      <div
        *ngIf="searchTerm()"
        class="absolute top-full left-0 w-full bg-zinc-100 dark:bg-zinc-800 rounded-lg mt-2 z-10"
      >
        <ul>
          <li
            *ngFor="let station of filteredStations()"
            (click)="navigateToStation(station.name)"
            class="p-4 cursor-pointer hover:bg-zinc-200 dark:hover:bg-zinc-700"
          >
            {{ station.name }}
          </li>
        </ul>
      </div>
    </div>
    <div class="mt-8 flex flex-col items-start space-y-4">
      <div
        *ngFor="let group of groupedLines"
        class="flex items-center justify-start space-x-2"
      >
        <a
          *ngFor="let line of group"
          [routerLink]="['/line', line]"
          class="no-underline"
        >
          <app-route-badge [routeId]="line" size="large"></app-route-badge>
        </a>
      </div>
    </div>
  </div>
</div>
