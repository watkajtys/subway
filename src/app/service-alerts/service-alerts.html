<div class="p-4">
  <div *ngIf="alerts().length > 0; else noAlerts">
    <div *ngFor="let alert of alerts()" class="mb-2 rounded-lg bg-zinc-800 p-4">
      <p class="font-bold">{{ alert.headerText?.translation?.[0]?.text }}</p>
      <p>{{ alert.descriptionText?.translation?.[0]?.text }}</p>
    </div>
  </div>
  <ng-template #noAlerts>
    <p class="text-zinc-400">No service alerts at this time.</p>
  </ng-template>
</div>
