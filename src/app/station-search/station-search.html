<div class="relative w-full max-w-md mx-auto">
  <div class="relative">
    <span class="material-symbols-outlined pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 dark:text-zinc-500">search</span>
    <input
      class="w-full rounded-xl border-zinc-300 dark:border-zinc-700 bg-zinc-100 dark:bg-zinc-800 py-4 pl-12 pr-4 text-base text-zinc-900 dark:text-white placeholder:text-zinc-500 dark:placeholder:text-zinc-400 focus:border-primary focus:ring-primary"
      placeholder="Search for a station..."
      type="text"
      [formControl]="searchControl"
    />
  </div>
  <div
    *ngIf="filteredStations$ | async as stations"
    class="absolute z-10 mt-2 w-full rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 shadow-lg"
    [hidden]="stations.length === 0"
  >
    <ul>
      <li *ngFor="let station of stations" (click)="selectStation(station)" class="px-4 py-3 cursor-pointer hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-lg">
        <p class="text-base text-zinc-900 dark:text-white">{{ station.name }}</p>
      </li>
    </ul>
  </div>
</div>
