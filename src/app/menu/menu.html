<div
  *ngIf="visible"
  class="fixed inset-0 z-20 flex flex-col bg-zinc-900 text-white"
>
  <div class="sticky top-0 z-10 flex items-center bg-zinc-900/80 p-4 pb-2 justify-between backdrop-blur-sm">
    <div class="flex size-12 shrink-0 items-center"></div>
    <h1 class="flex-1 text-lg text-center font-bold">Menu</h1>
    <div class="flex size-12 shrink-0 items-center justify-end">
      <button (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
  </div>

  <div class="flex-grow overflow-y-auto p-4">
    <div class="mb-4">
      <h2 class="text-lg font-bold">Favorites</h2>
      <div *ngIf="favorites().length > 0; else noFavorites">
        <app-favorite-card
          *ngFor="let favorite of favorites()"
          [favorite]="favorite"
        ></app-favorite-card>
      </div>
      <ng-template #noFavorites>
        <p class="text-zinc-400">You haven't added any favorites yet.</p>
      </ng-template>
    </div>
    <div>
      <h2 class="text-lg font-bold">Service Alerts</h2>
      <div *ngIf="alerts().length > 0; else noAlerts">
        <div *ngFor="let alert of alerts()" class="mb-2 rounded-lg bg-zinc-800 p-4">
          <p class="font-bold">{{ alert.headerText?.translation?.[0]?.text }}</p>
          <p>{{ alert.descriptionText?.translation?.[0]?.text }}</p>
        </div>
      </div>
      <ng-template #noAlerts>
        <p class="text-zinc-400">No service alerts for your favorite lines.</p>
      </ng-template>
    </div>
    <a routerLink="/service-alerts" (click)="onClose()" class="text-blue-500">View all service alerts</a>
  </div>
</div>
