<div (click)="closeMenu()" class="fixed inset-0 bg-zinc-800/70 backdrop-blur-sm z-50 backdrop">
  <div (click)="$event.stopPropagation()" class="absolute inset-0 md:inset-auto md:w-[420px] bg-zinc-900/90 text-white p-4 flex flex-col gap-4 overflow-y-auto menu-panel">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold">Menu</h2>
      <button (click)="closeMenu()" class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center">
        <span class="material-symbols-outlined">
          close
        </span>
      </button>
    </div>

    <div>
      <h3 class="text-lg font-semibold mb-2">Station Search</h3>
      <app-station-search (stationSelected)="onStationSelected($event)"></app-station-search>
    </div>

    <div class="flex-1 overflow-y-auto">
      <h3 class="text-lg font-semibold mb-2">Favorite Stations</h3>
      <div class="flex flex-col gap-2">
        <app-favorite-card *ngFor="let fav of favorites()" [favorite]="fav"></app-favorite-card>
        <p *ngIf="!favorites().length" class="text-zinc-400">You have no favorite stations yet.</p>
      </div>
    </div>

    <div>
      <h3 class="text-lg font-semibold mb-2">Lines</h3>
      <div class="flex flex-wrap gap-2">
        <ng-container *ngFor="let group of groupedLines">
          <a *ngFor="let line of group.lines" [routerLink]="['/line', line]">
            <app-route-badge [routeId]="line" size="large"></app-route-badge>
          </a>
        </ng-container>
      </div>
    </div>
  </div>
</div>
