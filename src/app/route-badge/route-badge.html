<div
  class="flex items-center justify-center font-bold rounded-full"
  [style.backgroundColor]="backgroundColor()"
  [style.color]="textColor()"
  [ngClass]="{
    'size-8': size === 'small',
    'text-sm': size === 'small',
    'size-12': size === 'large',
    'text-xl': size === 'large'
  }"
>
  <span>{{ routeId }}</span>
</div>
